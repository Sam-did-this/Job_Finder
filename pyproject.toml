[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-finder-pro"
version = "2.0.0"
description = "Search remote tech jobs, freelance gigs and local work from one CLI. Scores, dedupes and tracks what you've seen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam-did-this" }]
keywords = ["jobs", "freelance", "remote", "cli", "scraper", "rss", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "platformdirs>=4.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
job-finder = "job_finder.cli:main"

[project.urls]
Repository = "https://github.com/Sam-did-this/job-search-tools"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
